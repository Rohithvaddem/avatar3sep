<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff sign in · Avatar 3</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f7fa;color:#142b3c;font-family:system-ui,sans-serif;padding:24px}.card{width:min(420px,100%);background:white;padding:32px;border:1px solid #dce5ec;border-radius:20px;box-shadow:0 16px 48px #142b3c0d}img{width:220px;max-width:100%}h1{font-size:26px;margin:28px 0 8px}p{font-size:14px;color:#526479;line-height:1.5}label{display:block;margin-top:18px;font-size:14px;font-weight:600}input{width:100%;padding:13px;border:1px solid #aebfcd;border-radius:8px;margin-top:7px;font:inherit}input:focus{outline:2px solid #0b76aa;outline-offset:2px}button{width:100%;margin-top:24px;border:0;border-radius:8px;padding:14px;background:#086e9f;color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.6}#message{min-height:24px;color:#a12424}#passwordHelp{font-size:12px}
</style></head><body><main class="card"><img src="/aspirealty_label.png" alt="Aspirealty"><h1>Avatar 3 staff sign in</h1><p id="intro">Sign in with your invited staff account.</p><form id="authForm"><label id="emailLabel">Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label><p id="passwordHelp" hidden>Choose a unique password for your invited account.</p><button id="submit">Sign in</button></form><p id="message" role="alert"></p></main><script type="module" src="/staff-auth.js"></script></body></html>
